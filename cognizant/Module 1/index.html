<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Event Portal</title>

<link rel="stylesheet" href="styles.css">

<style>
    #welcomeBanner{
        background-color: blue;
        color: white;
        padding: 15px;
    }

    .highlight{
        background-color: yellow;
    }

    .event-img{
        border: 2px solid black;
        width: 200px;
        height: 150px;
    }

    form{
        width: 400px;
        padding: 20px;
        border: 1px solid gray;
    }
</style>

<script src="main.js" defer></script>
</head>
<body>

<!-- Navigation -->
<nav>
    <a href="#home">Home</a>
    <a href="#events">Events</a>
    <a href="#contact">Contact</a>
    <a href="help.html" target="_blank">Help</a>
</nav>

<!-- Main -->
<section id="home">
    <div id="welcomeBanner">
        Welcome User!
        <span style="color:red;font-weight:bold;">
            Special Offer
        </span>
    </div>

    <p class="highlight">
        Register today and get priority access.
    </p>
</section>

<!-- Event Gallery -->
<section id="gallery">
    <h2>Past Community Events</h2>

    <table>
        <tr>
            <td>
                <img src="img1.jpg" alt="Music Event"
                     title="Music Event" class="event-img"
                     ondblclick="enlargeImage(this)">
                <figcaption>Music Festival</figcaption>
            </td>

            <td>
                <img src="img2.jpg" alt="Workshop"
                     title="Workshop" class="event-img"
                     ondblclick="enlargeImage(this)">
                <figcaption>Baking Workshop</figcaption>
            </td>

            <td>
                <img src="img3.jpg" alt="Sports Event"
                     title="Sports Event" class="event-img"
                     ondblclick="enlargeImage(this)">
                <figcaption>Sports Meet</figcaption>
            </td>
        </tr>

        <tr>
            <td>
                <img src="img4.jpg" alt="Seminar"
                     title="Seminar" class="event-img">
                <figcaption>Education Seminar</figcaption>
            </td>

            <td>
                <img src="img5.jpg" alt="Charity"
                     title="Charity Event" class="event-img">
                <figcaption>Charity Drive</figcaption>
            </td>

            <td>
                <img src="img6.jpg" alt="Culture"
                     title="Cultural Event" class="event-img">
                <figcaption>Cultural Night</figcaption>
            </td>
        </tr>
    </table>
</section>

<!-- Events -->
<section id="events">
    <h2>Upcoming Events</h2>
</section>

<!-- Registration Form -->
<section id="contact">
    <h2>Event Registration</h2>

    <form id="regForm">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required
               autofocus>

        <br><br>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <br><br>

        <input type="tel"
               id="phone"
               placeholder="Phone Number"
               onblur="validatePhone()">

        <br><br>

        <input type="date"
               name="date"
               required>

        <br><br>

        <select id="eventType"
                name="eventType"
                onchange="showFee()">
            <option value="Music">Music</option>
            <option value="Workshop">Workshop</option>
            <option value="Sports">Sports</option>
        </select>

        <p id="fee"></p>

        <textarea id="feedback"
                  placeholder="Message"
                  onkeyup="countChars()"></textarea>

        <p>Characters: <span id="charCount">0</span></p>

        <br>

        <button type="submit"
                onclick="showConfirmation()">
            Register
        </button>

        <output id="msg"></output>

    </form>
</section>

<!-- Video Section -->
<section>
    <h2>Event Promo Video</h2>

    <video width="400"
           controls
           oncanplay="videoReady()">
        <source src="promo.mp4" type="video/mp4">
    </video>

    <p id="videoMessage"></p>
</section>

<!-- Local Storage -->
<section>
    <button onclick="savePreference()">
        Save Preference
    </button>

    <button onclick="clearPreference()">
        Clear Preferences
    </button>
</section>

<!-- Geolocation -->
<section>
    <button onclick="findLocation()">
        Find Nearby Events
    </button>

    <p id="location"></p>
</section>

<!-- Footer -->
<footer>
    <p>&copy; 2026 Community Event Portal</p>
</footer>

<script>

function validatePhone(){
    let phone = document.getElementById("phone").value;

    if(phone.length !== 10){
        alert("Enter a valid 10-digit phone number");
    }
}

function showFee(){
    let type = document.getElementById("eventType").value;
    let fee = "";

    if(type==="Music") fee="₹500";
    else if(type==="Workshop") fee="₹300";
    else fee="₹200";

    document.getElementById("fee").innerHTML =
        "Event Fee: " + fee;
}

function showConfirmation(){
    document.getElementById("msg").value =
        "Registration Successful!";
}

function enlargeImage(img){
    img.style.width = "350px";
    img.style.height = "250px";
}

function countChars(){
    document.getElementById("charCount").innerText =
        document.getElementById("feedback").value.length;
}

function videoReady(){
    document.getElementById("videoMessage").innerHTML =
        "Video ready to play";
}

function savePreference(){
    let value =
        document.getElementById("eventType").value;

    localStorage.setItem("preferredEvent", value);
}

window.onload = function(){
    let saved =
        localStorage.getItem("preferredEvent");

    if(saved){
        document.getElementById("eventType").value =
            saved;
    }
};

function clearPreference(){
    localStorage.clear();
    sessionStorage.clear();
}

function findLocation(){

    navigator.geolocation.getCurrentPosition(

        function(position){
            document.getElementById("location").innerHTML =
            "Latitude: " + position.coords.latitude +
            "<br>Longitude: " + position.coords.longitude;
        },

        function(error){
            alert("Location access denied");
        },

        {
            enableHighAccuracy:true,
            timeout:5000
        }
    );
}

window.onbeforeunload = function(){
    return "Form not submitted. Are you sure?";
};

</script>

</body>
</html>
